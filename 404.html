<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>S&amp;P Maritime Intelligence Platform</title>
  <script>
    // SPA redirect for GitHub Pages — encodes the path into the query string
    // so the root index.html can restore it after load.
    var l = window.location;
    var segmentCount = 1; // project pages: 1 segment (repo name)
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
